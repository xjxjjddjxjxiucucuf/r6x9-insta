name: Build R6X9 Instagram

on:
    workflow_dispatch:
        inputs:
            upload_artifact:
                description: "Upload Artifact"
                default: true
                required: false
                type: boolean

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build R6X9
        runs-on: macos-latest
        permissions:
            contents: write

        steps:
            - name: Checkout Main
              uses: actions/checkout@v4
              with:
                path: main
                submodules: recursive

            - name: Install Dependencies
              run: brew install ldid dpkg make

            - name: Set PATH environment variable
              run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

            - name: Setup Theos
              uses: actions/checkout@v4
              with:
                repository: theos/theos
                ref: master
                path: ${{ github.workspace }}/theos
                submodules: recursive

            # theos/logos master rewrote %orig handling in a way that breaks inline
            # %orig usage in this project; pin to the last known-good commit.
            - name: Pin Logos to known-good version
              run: |
                cd "$THEOS/vendor/logos"
                git fetch --depth=1 origin a62370066a97e36d59b200a9fa10c5091f5e8972
                git checkout a62370066a97e36d59b200a9fa10c5091f5e8972
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: SDK Caching
              id: SDK
              uses: actions/cache@v4
              env:
                cache-name: iPhoneOS16.2.sdk
              with:
                path: ${{ github.workspace }}/theos/sdks/
                key: ${{ env.cache-name }}
                restore-keys: ${{ env.cache-name }}

            - name: Download iOS SDK
              if: steps.SDK.outputs.cache-hit != 'true'
              run: |
                git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
                cd iOS-SDKs
                git sparse-checkout set --no-cone iPhoneOS16.2.sdk
                git checkout
                mv *.sdk $THEOS/sdks
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Prepare Instagram IPA (from base-ipa release)
              run: |
                cd main
                mkdir -p packages
                gh release download base-ipa \
                  --repo "$GITHUB_REPOSITORY" \
                  --pattern "*.ipa" \
                  --output packages/com.burbn.instagram.ipa
                ls -la packages
              env:
                GH_TOKEN: ${{ github.token }}

            - name: Get version
              id: version
              run: |
                VERSION=$(awk '/Version:/ {print $2}' main/control)
                echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
                echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

            - name: Build R6X9 tweak for sideloading (as IPA)
              run: |
                pip install --force-reinstall https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

                cd main
                curl -Lo ipapatch https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.3/ipapatch.macos-arm64
                chmod +x ipapatch
                export PATH=.:$PATH
                ls -la

                ./build.sh sideload
                ls -la packages
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Rename IPA to include version info
              run: |
                cd main/packages
                mv "SCInsta-sideloaded.ipa" "R6X9-Instagram-v${VERSION}.ipa" 2>/dev/null || mv "$(ls -t *.ipa | head -n1)" "R6X9-Instagram-v${VERSION}.ipa"

            - name: Pass package name to upload action
              id: package_name
              run: |
                echo "package=$(ls -t main/packages/*.ipa | head -n1 | xargs basename)" >> "$GITHUB_OUTPUT"

            - name: Upload Artifact
              if: ${{ inputs.upload_artifact }}
              uses: actions/upload-artifact@v4
              with:
                name: R6X9-Instagram-v${{ steps.version.outputs.version }}
                path: ${{ github.workspace }}/main/packages/${{ steps.package_name.outputs.package }}
                if-no-files-found: error

            - name: Create Release
              uses: softprops/action-gh-release@v2.0.6
              with:
                tag_name: r6x9-build-${{ github.run_number }}
                name: R6X9 Instagram v${{ steps.version.outputs.version }} (build ${{ github.run_number }})
                files: ${{ github.workspace }}/main/packages/R6X9-Instagram-v*.ipa
                draft: false

            - name: Output Release URL
              run: |
                echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
